# codemagic.yaml
workflows:
  ios-workflow:
    name: Trimswipe iOS Production
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - Env 
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.fiskerik.trimswipe"
      xcode: latest
      cocoapods: default
      node: 22.12.0
      vars:
        BUNDLE_ID: "com.fiskerik.trimswipe" # Fixed to match your real app bundle ID
        APP_MARKETING_VERSION: "1.1.5"
        EXPO_NO_TYPESCRIPT_SETUP: "1"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    integrations:
      app_store_connect: Codemagic Key 
    scripts:
      - name: Configure and validate native services
        script: |
          first_value() {
            for candidate in "$@"; do
              case "$candidate" in
                ""|@*|\$*) ;;
                *) printf '%s' "$candidate"; return 0 ;;
              esac
            done
            printf ''
          }

          REVENUECAT_KEY=$(first_value \
            "${EXPO_PUBLIC_RC_KEY:-}" \
            "${RC_API_KEY:-}" \
            "${rc_api_key:-}" \
            "${REVENUECAT_IOS_API_KEY:-}")
          REVENUECAT_ENTITLEMENT=$(first_value \
            "${EXPO_PUBLIC_RC_ENTITLEMENT_ID:-}" \
            "${RC_ENTITLEMENT_ID:-}" \
            "${rc_entitlement_id:-}")
          REVENUECAT_PRODUCT=$(first_value \
            "${EXPO_PUBLIC_RC_LIFETIME_PRODUCT_ID:-}" \
            "${RC_PRODUCT_ID:-}" \
            "${rc_product_id:-}")
          LEVELPLAY_IOS_APP=$(first_value \
            "${EXPO_PUBLIC_IRONSRC_IOS_APP_ID:-}" \
            "${EXPO_PUBLIC_IRONSRC_IOS_APP_KEY:-}" \
            "${IRONSRC_IOS_APP_ID:-}" \
            "${ironsrc_ios_app_id:-}" \
            "26d9fb51d")
          LEVELPLAY_IOS_REWARDED=$(first_value \
            "${EXPO_PUBLIC_IRONSRC_IOS_REWARDED_ID:-}" \
            "${IRONSRC_IOS_REWARDED_ID:-}" \
            "${ironsrc_ios_rewarded_id:-}" \
            "nt81b397cbikquwn")
          LEVELPLAY_IOS_INTERSTITIAL=$(first_value \
            "${EXPO_PUBLIC_IRONSRC_IOS_INTERSTITIAL_ID:-}" \
            "${IRONSRC_IOS_INTERSTITIAL_ID:-}" \
            "${ironsrc_ios_interstitial_id:-}" \
            "bini0fp5s7f2cuni")
          LEVELPLAY_IOS_BANNER=$(first_value \
            "${EXPO_PUBLIC_IRONSRC_IOS_BANNER_ID:-}" \
            "${IRONSRC_IOS_BANNER_ID:-}" \
            "${ironsrc_ios_banner_id:-}" \
            "0zimioxn3plu2mxk")
          LEVELPLAY_ADAPTER_DEBUG=$(first_value \
            "${EXPO_PUBLIC_IRONSRC_ADAPTER_DEBUG:-}" \
            "${IRONSRC_ADAPTER_DEBUG:-}" \
            "false")
          META_IOS_MREC_PLACEMENT=$(first_value \
            "${EXPO_PUBLIC_META_IOS_MREC_PLACEMENT_ID:-}" \
            "${EXPO_PUBLIC_META_IOS_NATIVE_PLACEMENT_ID:-}" \
            "${META_IOS_MREC_PLACEMENT_ID:-}" \
            "${META_IOS_NATIVE_PLACEMENT_ID:-}" \
            "${meta_ios_mrec_placement_id:-}")
          # Codemagic values copied from a dashboard can contain surrounding
          # whitespace or quotes. Normalize those without accepting a partial ID.
          META_IOS_MREC_PLACEMENT=$(printf '%s' "$META_IOS_MREC_PLACEMENT" | xargs)

          case "$REVENUECAT_KEY" in
            appl_*) ;;
            *)
              echo "RevenueCat iOS API key is missing or invalid. Add EXPO_PUBLIC_RC_KEY, RC_API_KEY, or rc_api_key to the Env group."
              exit 1
              ;;
          esac
          if [ -z "$REVENUECAT_ENTITLEMENT" ]; then
            echo "RevenueCat entitlement ID is missing. Add EXPO_PUBLIC_RC_ENTITLEMENT_ID, RC_ENTITLEMENT_ID, or rc_entitlement_id to the Env group."
            exit 1
          fi
          if [ -z "$REVENUECAT_PRODUCT" ]; then
            echo "RevenueCat lifetime product ID is missing. Add EXPO_PUBLIC_RC_LIFETIME_PRODUCT_ID, RC_PRODUCT_ID, or rc_product_id to the Env group."
            exit 1
          fi
          if [ -z "$LEVELPLAY_IOS_APP" ] || [ -z "$LEVELPLAY_IOS_REWARDED" ] || [ -z "$LEVELPLAY_IOS_INTERSTITIAL" ]; then
            echo "Unity LevelPlay iOS app key, rewarded ID, and interstitial ID are required."
            exit 1
          fi
          if [ "$LEVELPLAY_IOS_BANNER" = "q8m51pm2jg2br5yf" ]; then
            echo "Replacing the legacy Native ad-unit ID in the Banner variable with the iOS Banner ad-unit ID."
            LEVELPLAY_IOS_BANNER="0zimioxn3plu2mxk"
          fi
          case "$LEVELPLAY_ADAPTER_DEBUG" in
            true|false) ;;
            *)
              echo "EXPO_PUBLIC_IRONSRC_ADAPTER_DEBUG must be true or false."
              exit 1
              ;;
          esac
          if ! [[ "$META_IOS_MREC_PLACEMENT" =~ ^[0-9]+_[0-9]+$ ]]; then
            echo "EXPO_PUBLIC_META_IOS_MREC_PLACEMENT_ID (or EXPO_PUBLIC_META_IOS_NATIVE_PLACEMENT_ID) must be the complete numeric Meta placement ID."
            exit 1
          fi

          printf 'EXPO_PUBLIC_RC_KEY=%s\n' "$REVENUECAT_KEY" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_RC_ENTITLEMENT_ID=%s\n' "$REVENUECAT_ENTITLEMENT" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_RC_LIFETIME_PRODUCT_ID=%s\n' "$REVENUECAT_PRODUCT" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_IRONSRC_IOS_APP_ID=%s\n' "$LEVELPLAY_IOS_APP" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_IRONSRC_IOS_REWARDED_ID=%s\n' "$LEVELPLAY_IOS_REWARDED" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_IRONSRC_IOS_INTERSTITIAL_ID=%s\n' "$LEVELPLAY_IOS_INTERSTITIAL" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_IRONSRC_IOS_BANNER_ID=%s\n' "$LEVELPLAY_IOS_BANNER" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_IRONSRC_ADAPTER_DEBUG=%s\n' "$LEVELPLAY_ADAPTER_DEBUG" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_META_IOS_MREC_PLACEMENT_ID=%s\n' "$META_IOS_MREC_PLACEMENT" >> "$CM_ENV"

      - name: Build Root Mobile SPA Bundle
        script: |
          echo "=== Building root mobile web bundle ==="
          npm install
          npm run build:mobile-spa

      - name: Install Mobile Project Dependencies
        script: |
          cd mobile/mobile
          npm install

      - name: Expo Prebuild (Generate Native Directories)
        script: |
          cd mobile/mobile
          npx expo prebuild --platform ios --no-install
      - name: Set iOS marketing version
        script: |
          cd mobile/mobile/ios
          # Apply the current App Store Connect marketing version before signing.
          if [ -z "${APP_MARKETING_VERSION:-}" ]; then
            echo "APP_MARKETING_VERSION is required."
            exit 1
          fi
          agvtool new-marketing-version "$APP_MARKETING_VERSION"
          echo "Set CFBundleShortVersionString to $APP_MARKETING_VERSION"
          agvtool what-marketing-version
      - name: Set iOS build number
        script: |
          cd mobile/mobile/ios
          # Keep build numbers above the previously released train and unique across uploads.
          MINIMUM_BUILD_NUMBER=72
          BUILD_NUMBER_OFFSET=48
          if [[ "${PROJECT_BUILD_NUMBER:-}" =~ ^[0-9]+$ ]]; then
          CI_BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + BUILD_NUMBER_OFFSET))
          else
          CI_BUILD_NUMBER=0
          fi
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "com.fiskerik.trimswipe" --all-versions 2>/dev/null || true)
          if [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
          STORE_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          else
          STORE_BUILD_NUMBER=0
          fi
          NEW_BUILD_NUMBER=$CI_BUILD_NUMBER
          if [ "$NEW_BUILD_NUMBER" -lt "$STORE_BUILD_NUMBER" ]; then
          NEW_BUILD_NUMBER=$STORE_BUILD_NUMBER
          fi
          if [ "$NEW_BUILD_NUMBER" -lt "$MINIMUM_BUILD_NUMBER" ]; then
          NEW_BUILD_NUMBER=$MINIMUM_BUILD_NUMBER
          fi
          agvtool new-version -all $NEW_BUILD_NUMBER
          echo "Set CFBundleVersion to $NEW_BUILD_NUMBER"
      - name: Initialize signing certificates
        script: |
          keychain initialize
          # Codemagic CLI uses --type for the distribution profile; the legacy
          # project-type option is no longer accepted by app-store-connect.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          # Scope profile application to the generated app project. Expo
          # dependencies (including RNDateTimePicker) contain their own
          # .xcodeproj files which must not receive the app's signing profile.
          xcode-project use-profiles \
            --project "mobile/mobile/ios/TrimSwipe.xcodeproj"

      - name: Build iOS IPA
        script: |
          cd mobile/mobile/ios
          pod install --repo-update
          if grep -Eq "GoogleMobileAds|GoogleMobileAdsMediation" Podfile.lock; then
            echo "ERROR: Google Mobile Ads pods are still present; this build must use direct Unity LevelPlay."
            grep -E "GoogleMobileAds|GoogleMobileAdsMediation" Podfile.lock || true
            exit 1
          fi
          if ! grep -Fq "IronSourceFacebookAdapter (5.4.0.0)" Podfile.lock; then
            echo "ERROR: The Unity LevelPlay Meta adapter is missing or has an unexpected version."
            grep -E "IronSourceFacebookAdapter|FBAudienceNetwork" Podfile.lock || true
            exit 1
          fi
          if ! grep -Fq "FBAudienceNetwork (6.22.0)" Podfile.lock; then
            echo "ERROR: The Meta Audience Network SDK is missing or has an unexpected version."
            grep -E "IronSourceFacebookAdapter|FBAudienceNetwork" Podfile.lock || true
            exit 1
          fi
          if ! grep -Fq "ExpoMetaMrec" Podfile.lock; then
            echo "ERROR: The direct Meta MREC Expo module was not linked into the iOS build."
            grep -E "ExpoMetaMrec|FBAudienceNetwork" Podfile.lock || true
            exit 1
          fi
          xcode-project build-ipa --workspace *.xcworkspace --scheme "TrimSwipe"
    artifacts:
      
       - mobile/mobile/ios/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - erik.abrahamsson@live.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true  
