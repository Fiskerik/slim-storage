# codemagic.yaml
workflows:
  ios-workflow:
    name: Trimswipe iOS Production
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - Env 
      ios_signing:
        distribution_type: app_store
        bundle_identifier: "com.fiskerik.trimswipe"
      xcode: latest
      cocoapods: default
      node: 22.12.0
      vars:
        BUNDLE_ID: "com.fiskerik.trimswipe" # Fixed to match your real app bundle ID
        APP_MARKETING_VERSION: "1.1.3"
        EXPO_NO_TYPESCRIPT_SETUP: "1"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    integrations:
      app_store_connect: Codemagic Key 
    scripts:
      - name: Configure and validate native services
        script: |
          first_value() {
            for candidate in "$@"; do
              case "$candidate" in
                ""|@*|\$*) ;;
                *) printf '%s' "$candidate"; return 0 ;;
              esac
            done
            printf ''
          }

          REVENUECAT_KEY=$(first_value \
            "${EXPO_PUBLIC_RC_KEY:-}" \
            "${RC_API_KEY:-}" \
            "${rc_api_key:-}" \
            "${REVENUECAT_IOS_API_KEY:-}")
          REVENUECAT_ENTITLEMENT=$(first_value \
            "${EXPO_PUBLIC_RC_ENTITLEMENT_ID:-}" \
            "${RC_ENTITLEMENT_ID:-}" \
            "${rc_entitlement_id:-}")
          REVENUECAT_PRODUCT=$(first_value \
            "${EXPO_PUBLIC_RC_LIFETIME_PRODUCT_ID:-}" \
            "${RC_PRODUCT_ID:-}" \
            "${rc_product_id:-}")
          ADMOB_IOS_APP=$(first_value \
            "${EXPO_PUBLIC_ADMOB_IOS_APP_ID:-}" \
            "${EXPO_PUBLIC_APP_ID:-}" \
            "${ADMOB_IOS_APP_ID:-}" \
            "${admob_ios_app_id:-}")
          ADMOB_IOS_REWARDED=$(first_value \
            "${EXPO_PUBLIC_ADMOB_IOS_REWARDED_ID:-}" \
            "${EXPO_PUBLIC_IOS_REWARDED_ID:-}" \
            "${ADMOB_IOS_REWARDED_ID:-}" \
            "${admob_ios_rewarded_id:-}")
          ADMOB_IOS_INTERSTITIAL=$(first_value \
            "${EXPO_PUBLIC_ADMOB_IOS_INTERSTITIAL_ID:-}" \
            "${EXPO_PUBLIC_IOS_INTERSTITIAL_ID:-}" \
            "${ADMOB_IOS_INTERSTITIAL_ID:-}" \
            "${admob_ios_interstitial_id:-}")
          ADMOB_IOS_NATIVE_MIDSET=$(first_value \
            "${EXPO_PUBLIC_IOS_NATIVE_MIDSET_ID:-}" \
            "${ADMOB_IOS_NATIVE_MIDSET_ID:-}" \
            "${admob_ios_native_midset_id:-}")
          ADMOB_USE_TEST_ADS=$(first_value \
            "${EXPO_PUBLIC_ADMOB_USE_TEST_ADS:-}" \
            "${ADMOB_USE_TEST_ADS:-}" \
            "false")
          ADMOB_ENABLE_INSPECTOR=$(first_value \
            "${EXPO_PUBLIC_ADMOB_ENABLE_INSPECTOR:-}" \
            "${ADMOB_ENABLE_INSPECTOR:-}" \
            "false")

          case "$REVENUECAT_KEY" in
            appl_*) ;;
            *)
              echo "RevenueCat iOS API key is missing or invalid. Add EXPO_PUBLIC_RC_KEY, RC_API_KEY, or rc_api_key to the Env group."
              exit 1
              ;;
          esac
          if [ -z "$REVENUECAT_ENTITLEMENT" ]; then
            echo "RevenueCat entitlement ID is missing. Add EXPO_PUBLIC_RC_ENTITLEMENT_ID, RC_ENTITLEMENT_ID, or rc_entitlement_id to the Env group."
            exit 1
          fi
          if [ -z "$REVENUECAT_PRODUCT" ]; then
            echo "RevenueCat lifetime product ID is missing. Add EXPO_PUBLIC_RC_LIFETIME_PRODUCT_ID, RC_PRODUCT_ID, or rc_product_id to the Env group."
            exit 1
          fi
          case "$ADMOB_IOS_APP" in
            ca-app-pub-*~*) ;;
            *)
              echo "AdMob iOS app ID is missing or invalid. Add EXPO_PUBLIC_ADMOB_IOS_APP_ID to the Env group (format: ca-app-pub-...~...)."
              exit 1
              ;;
          esac
          case "$ADMOB_USE_TEST_ADS" in
            true|false) ;;
            *)
              echo "EXPO_PUBLIC_ADMOB_USE_TEST_ADS must be true or false."
              exit 1
              ;;
          esac
          case "$ADMOB_ENABLE_INSPECTOR" in
            true|false) ;;
            *)
              echo "EXPO_PUBLIC_ADMOB_ENABLE_INSPECTOR must be true or false."
              exit 1
              ;;
          esac
          if [ "$ADMOB_USE_TEST_ADS" != "true" ]; then
            case "$ADMOB_IOS_REWARDED" in
              ca-app-pub-*/*) ;;
              *)
                echo "AdMob iOS rewarded ad-unit ID is missing or invalid. Add EXPO_PUBLIC_ADMOB_IOS_REWARDED_ID to the Env group (format: ca-app-pub-.../...)."
                exit 1
                ;;
            esac
            case "$ADMOB_IOS_INTERSTITIAL" in
              ca-app-pub-*/*) ;;
              *)
                echo "AdMob iOS interstitial ad-unit ID is missing or invalid. Add EXPO_PUBLIC_ADMOB_IOS_INTERSTITIAL_ID to the Env group (format: ca-app-pub-.../...)."
                exit 1
                ;;
            esac
            case "$ADMOB_IOS_NATIVE_MIDSET" in
              ca-app-pub-*/*) ;;
              *)
                echo "AdMob iOS native mid-set ad-unit ID is missing or invalid. Add EXPO_PUBLIC_IOS_NATIVE_MIDSET_ID to the Env group (format: ca-app-pub-.../...)."
                exit 1
                ;;
            esac
          fi

          printf 'EXPO_PUBLIC_RC_KEY=%s\n' "$REVENUECAT_KEY" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_RC_ENTITLEMENT_ID=%s\n' "$REVENUECAT_ENTITLEMENT" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_RC_LIFETIME_PRODUCT_ID=%s\n' "$REVENUECAT_PRODUCT" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_ADMOB_IOS_APP_ID=%s\n' "$ADMOB_IOS_APP" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_ADMOB_IOS_REWARDED_ID=%s\n' "$ADMOB_IOS_REWARDED" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_ADMOB_IOS_INTERSTITIAL_ID=%s\n' "$ADMOB_IOS_INTERSTITIAL" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_IOS_NATIVE_MIDSET_ID=%s\n' "$ADMOB_IOS_NATIVE_MIDSET" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_ADMOB_USE_TEST_ADS=%s\n' "$ADMOB_USE_TEST_ADS" >> "$CM_ENV"
          printf 'EXPO_PUBLIC_ADMOB_ENABLE_INSPECTOR=%s\n' "$ADMOB_ENABLE_INSPECTOR" >> "$CM_ENV"

      - name: Build Root Mobile SPA Bundle
        script: |
          echo "=== Building root mobile web bundle ==="
          npm install
          npm run build:mobile-spa

      - name: Install Mobile Project Dependencies
        script: |
          cd mobile/mobile
          npm install

      - name: Expo Prebuild (Generate Native Directories)
        script: |
          cd mobile/mobile
          npx expo prebuild --platform ios --no-install
      - name: Set iOS marketing version
        script: |
          cd mobile/mobile/ios
          # Apply the current App Store Connect marketing version before signing.
          if [ -z "${APP_MARKETING_VERSION:-}" ]; then
            echo "APP_MARKETING_VERSION is required."
            exit 1
          fi
          agvtool new-marketing-version "$APP_MARKETING_VERSION"
          echo "Set CFBundleShortVersionString to $APP_MARKETING_VERSION"
          agvtool what-marketing-version
      - name: Set iOS build number
        script: |
          cd mobile/mobile/ios
          # Keep build numbers above the previously released train and unique across uploads.
          MINIMUM_BUILD_NUMBER=68
          BUILD_NUMBER_OFFSET=48
          if [[ "${PROJECT_BUILD_NUMBER:-}" =~ ^[0-9]+$ ]]; then
          CI_BUILD_NUMBER=$((PROJECT_BUILD_NUMBER + BUILD_NUMBER_OFFSET))
          else
          CI_BUILD_NUMBER=0
          fi
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "com.fiskerik.trimswipe" --all-versions 2>/dev/null || true)
          if [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
          STORE_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          else
          STORE_BUILD_NUMBER=0
          fi
          NEW_BUILD_NUMBER=$CI_BUILD_NUMBER
          if [ "$NEW_BUILD_NUMBER" -lt "$STORE_BUILD_NUMBER" ]; then
          NEW_BUILD_NUMBER=$STORE_BUILD_NUMBER
          fi
          if [ "$NEW_BUILD_NUMBER" -lt "$MINIMUM_BUILD_NUMBER" ]; then
          NEW_BUILD_NUMBER=$MINIMUM_BUILD_NUMBER
          fi
          agvtool new-version -all $NEW_BUILD_NUMBER
          echo "Set CFBundleVersion to $NEW_BUILD_NUMBER"
      - name: Initialize signing certificates
        script: |
          app-store-connect fetch-signing-files "com.fiskerik.trimswipe" --project-type ios
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd mobile/mobile/ios
          pod install --repo-update
          if ! grep -q "GoogleMobileAdsMediationFacebook (6.21.1.0)" Podfile.lock || ! grep -q "GoogleMobileAdsMediationUnity (4.17.0.0)" Podfile.lock; then
            echo "ERROR: AdMob Meta/Unity mediation adapters are missing or have unexpected versions."
            grep -E "GoogleMobileAdsMediation(Facebook|Unity)" Podfile.lock || true
            exit 1
          fi
          xcode-project build-ipa --workspace *.xcworkspace --scheme "TrimSwipe"
    artifacts:
      
       - mobile/mobile/ios/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - erik.abrahamsson@live.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true  
